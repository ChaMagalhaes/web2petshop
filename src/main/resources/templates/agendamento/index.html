
<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<th:block th:replace="~{fragments/head :: head('Listar Agendamentos')}"></th:block>

<body>

<th:block th:replace="~{fragments/head :: header()}"></th:block>

<div class="container mt-4">

    <!-- Cabeçalho -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Lista de Agendamentos</h1>

        <a sec:authorize="hasAuthority('ADMIN')"
           th:href="@{/agendamento/criar}"
           class="btn btn-primary">
            Cadastrar Novo Agendamento
        </a>
    </div>

    <!-- Tabela -->
    <table class="table table-striped">

        <thead>
        <tr>
            <th scope="col">ID</th>
            <th scope="col">Pet</th>
            <th scope="col">Data e Hora</th>
            <th scope="col">Status</th>
            <th scope="col">Valor Total</th>
            <th scope="col" sec:authorize="hasAuthority('ADMIN')">Ações</th>
        </tr>
        </thead>

        <tbody>

        <!-- Mensagem quando não houver agendamentos -->
        <tr th:if="${agendamentosList.isEmpty()}">
            <td colspan="6" class="text-center">
                Nenhum agendamento encontrado.
            </td>
        </tr>

        <!-- Listagem -->
        <tr th:each="agendamento : ${agendamentosList}">

            <td th:text="${agendamento.id}"></td>

            <td th:text="${agendamento.pet.nome}"></td>

            <td th:text="${#temporals.format(
                            agendamento.dataHora,
                            'dd/MM/yyyy HH:mm'
                        )}">
            </td>

            <td th:text="${agendamento.status}"></td>

            <td th:text="${#numbers.formatCurrency(
                            agendamento.total
                        )}">
            </td>

            <!-- Ações: somente ADMIN -->
            <td sec:authorize="hasAuthority('ADMIN')">
                <div class="d-flex">

                    <a th:href="@{/agendamento/editar/{id}(id=${agendamento.id})}"
                       class="btn btn-primary btn-sm mr-2">
                        Editar
                    </a>

                    <form th:action="@{/agendamento/deletar/{id}(id=${agendamento.id})}"
                          method="post"
                          onsubmit="return confirm('Tem certeza que deseja excluir este agendamento?');">

                        <button type="submit"
                                class="btn btn-danger btn-sm">
                            Excluir
                        </button>

                    </form>

                </div>
            </td>

        </tr>

        </tbody>
    </table>

</div>

<th:block th:replace="~{fragments/footer :: footer()}"></th:block>

</body>
</html>
