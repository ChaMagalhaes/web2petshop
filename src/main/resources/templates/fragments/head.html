<head th:fragment="head(title)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${title}">PetShop</title>

    <!-- Bootstrap CSS -->
    <link
            rel="stylesheet"
            href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
            integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
            crossorigin="anonymous"
    />

    <!-- jQuery -->
    <script
            src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
            integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
            crossorigin="anonymous">
    </script>

    <!-- Popper.js -->
    <script
            src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js"
            integrity="sha384-ZMP7rVo3mIykV+2+9UJ3jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49"
            crossorigin="anonymous">
    </script>

    <!-- Bootstrap JS -->
    <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js"
            integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy"
            crossorigin="anonymous">
    </script>

    <!-- CSS personalizado -->
    <link rel="stylesheet" th:href="@{/css/custom.css}"/>
</head>

<nav
        th:fragment="header()"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
        class="container-fluid navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">
        <!-- Logo / Nome do sistema -->
        <a class="navbar-brand" th:href="@{/pet}">
            Petshop
        </a>

        <!-- Botão mobile -->
        <button
                class="navbar-toggler"
                type="button"
                data-toggle="collapse"
                data-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent"
                aria-expanded="false"
                aria-label="Toggle navigation"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Itens da navegação -->
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav mr-auto">

                <!-- Pets -->
                <li class="nav-item dropdown">

                    <a
                            class="nav-link dropdown-toggle"
                            th:href="@{/pet}"
                            id="navbarDropdown"
                            role="button"
                            data-toggle="dropdown"
                            aria-haspopup="true"
                            aria-expanded="false"
                    >
                        Pets
                    </a>

                    <div class="dropdown-menu" aria-labelledby="navbarDropdown">
                        <!-- USER e ADMIN -->
                        <a class="dropdown-item" th:href="@{/pet}">
                            Listar
                        </a>

                        <!-- Somente ADMIN -->
                        <a sec:authorize="hasAuthority('ADMIN')" class="dropdown-item" th:href="@{/pet/criar}">
                            Cadastrar
                        </a>
                    </div>
                </li>
            </ul>
            <!-- Logout: usuários autenticados -->
            <form
                    sec:authorize="isAuthenticated()"
                    class="form-inline my-2 my-lg-0"
                    th:action="@{/logout}"
                    method="post">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}" />

                <button type="submit" class="btn btn-secondary my-2 my-sm-0">
                    Sair
                </button>
            </form>
        </div>
    </div>
</nav>
