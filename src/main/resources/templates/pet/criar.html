<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Cadastrar Pet</title>

    <link
            rel="stylesheet"
            href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
            integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
            crossorigin="anonymous"
    />
</head>
<body>

<div class="container pt-5">
    <h1>Cadastrar Pet</h1>

    <form action="#" th:action="@{/pet/salvar}" th:object="${pet}" method="POST">

        <!-- Nome -->
        <div class="form-group row">
            <label for="nome" class="col-sm-2 col-form-label">Nome</label>
            <div class="col-sm-10">
                <input
                        type="text"
                        th:field="*{nome}"
                        class="form-control"
                        id="nome"
                        name="nome"
                        placeholder="Digite o nome do pet"
                        required
                >
            </div>
        </div>

        <!-- Raca -->
        <div class="form-group row">
            <label class="col-sm-2 col-form-label" for="raca">Raca:</label>
            <div class="col-sm-10">
                <input
                    type="text"
                    th:field="*{raca}"
                    class="form-control"
                    id="raca"
                    name="raca"
                    placeholder="Digite a raca do pet"
                    required
                >
            </div>
        </div>

        <!-- Idade -->
        <div class="form-group row">
            <label class="col-sm-2 col-form-label" for="idade">Idade:</label>
            <div class="col-sm-10">
                <input
                        type="number"
                        th:field="*{idade}"
                        class="form-control"
                        id="idade"
                        name="idade"
                        min="0"
                        placeholder="Digite a idade do pet"
                        required
                >
            </div>
        </div>

        <!-- Tamanho -->
        <div class="form-group row">
            <label class="col-sm-2 col-form-label" for="tamanho">Tamanho:</label>
            <div class="col-sm-10">
                <select
                        th:field="*{tamanho}"
                        class="form-control"
                        id="tamanho"
                        required
                >
                    <option value="">Selecione o tamanho</option>
                    <option value="PEQUENO">Pequeno</option>
                    <option value="MEDIO">Médio</option>
                    <option value="GRANDE">Grande</option>
                </select>
            </div>
        </div>

        <button type="submit" class="btn btn-info col-2">
            Cadastrar Pet
        </button>

    </form>
</div>
</body>
</html>
