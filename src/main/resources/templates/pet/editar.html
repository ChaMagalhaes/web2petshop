<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<th:block th:replace="~{fragments/head :: head('Editar Pet')}"></th:block>
<body>
<th:block th:replace="~{fragments/head :: header()}"></th:block>
<div class="container pt-5">
    <h1>Editar Pet</h1>

    <form action="#" th:action="@{/pet/salvar}" th:object="${pet}" method="POST">

        <!-- Campo necessário para que o save saiba que não estamos criando, mas editando um produto -->
        <input type="hidden" th:field="*{id}" />

        <!-- Nome -->
        <div class="form-group row">
            <label for="nome" class="col-sm-2 col-form-label">Nome</label>
            <div class="col-sm-10">
                <input
                        type="text"
                        th:field="*{nome}"
                        class="form-control"
                        id="nome"
                        name="nome"
                        placeholder="Digite o nome do pet"
                        required
                >
                <p th:if="${#fields.hasErrors('nome')}" th:errorclass="text-danger" th:errors="*{nome}"></p>
            </div>
        </div>

        <!-- Raca -->
        <div class="form-group row">
            <label class="col-sm-2 col-form-label" for="raca">Raca:</label>
            <div class="col-sm-10">
                <input
                        type="text"
                        th:field="*{raca}"
                        class="form-control"
                        id="raca"
                        name="raca"
                        placeholder="Digite a raca do pet"
                        required
                >
                <p th:if="${#fields.hasErrors('raca')}" th:errorclass="text-danger" th:errors="*{raca}"></p>
            </div>
        </div>

        <!-- Idade -->
        <div class="form-group row">
            <label class="col-sm-2 col-form-label" for="idade">Idade:</label>
            <div class="col-sm-10">
                <input
                        type="number"
                        th:field="*{idade}"
                        class="form-control"
                        id="idade"
                        name="idade"
                        min="0"
                        placeholder="Digite a idade do pet"
                        required
                >
                <p th:if="${#fields.hasErrors('idade')}" th:errorclass="text-danger" th:errors="*{idade}"></p>
            </div>
        </div>

        <!-- Tamanho -->
        <div class="form-group row">
            <label class="col-sm-2 col-form-label" for="tamanho">Tamanho:</label>
            <div class="col-sm-10">
                <select
                        th:field="*{tamanho}"
                        class="form-control"
                        id="tamanho"
                        required
                >
                    <option value="">Selecione o tamanho</option>
                    <option value="PEQUENO">Pequeno</option>
                    <option value="MEDIO">Médio</option>
                    <option value="GRANDE">Grande</option>
                </select>
                <p th:if="${#fields.hasErrors('tamanho')}" th:errorclass="text-danger" th:errors="*{tamanho}"></p>
            </div>
        </div>

        <button type="submit" class="btn btn-info col-2">
            Atualizar Pet
        </button>
    </form>
</div>
<th:block th:replace="~{fragments/footer :: footer()}"></th:block>
</body>
</html>
