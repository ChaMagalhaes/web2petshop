
<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<th:block th:replace="~{fragments/head :: head(${pet.id == null} ? 'Cadastrar Pet' : 'Editar Pet')}"></th:block>

<body>

<th:block th:replace="~{fragments/head :: header()}"></th:block>

<div class="container mt-4">

    <!-- Cabeçalho -->
    <div class="mb-3">
        <h1 th:text="${pet.id == null} ? 'Cadastrar Pet' : 'Editar Pet'">
            Cadastrar Pet
        </h1>
    </div>

    <!-- Formulário -->
    <form th:action="@{/pet/salvar}"
          th:object="${pet}"
          method="POST">

        <!-- ID necessário para identificar o pet durante a edição -->
        <input type="hidden" th:field="*{id}" />

        <!-- Nome -->
        <div class="form-group row">
            <label for="nome" class="col-sm-2 col-form-label">
                Nome:
            </label>

            <div class="col-sm-10">
                <input type="text"
                       th:field="*{nome}"
                       class="form-control"
                       id="nome"
                       placeholder="Digite o nome do pet"
                       required>

                <p th:if="${#fields.hasErrors('nome')}"
                   th:errorclass="text-danger"
                   th:errors="*{nome}">
                </p>
            </div>
        </div>

        <!-- Raça -->
        <div class="form-group row">
            <label for="raca" class="col-sm-2 col-form-label">
                Raça:
            </label>

            <div class="col-sm-10">
                <input type="text"
                       th:field="*{raca}"
                       class="form-control"
                       id="raca"
                       placeholder="Digite a raça do pet"
                       required>

                <p th:if="${#fields.hasErrors('raca')}"
                   th:errorclass="text-danger"
                   th:errors="*{raca}">
                </p>
            </div>
        </div>

        <!-- Idade -->
        <div class="form-group row">
            <label for="idade" class="col-sm-2 col-form-label">
                Idade:
            </label>

            <div class="col-sm-10">
                <input type="number"
                       th:field="*{idade}"
                       class="form-control"
                       id="idade"
                       min="0"
                       placeholder="Digite a idade do pet"
                       required>

                <p th:if="${#fields.hasErrors('idade')}"
                   th:errorclass="text-danger"
                   th:errors="*{idade}">
                </p>
            </div>
        </div>

        <!-- Tamanho -->
        <div class="form-group row">
            <label for="tamanho" class="col-sm-2 col-form-label">
                Tamanho:
            </label>

            <div class="col-sm-10">
                <select th:field="*{tamanho}"
                        class="form-control"
                        id="tamanho"
                        required>

                    <option value="">Selecione o tamanho</option>
                    <option value="PEQUENO">Pequeno</option>
                    <option value="MEDIO">Médio</option>
                    <option value="GRANDE">Grande</option>

                </select>

                <p th:if="${#fields.hasErrors('tamanho')}"
                   th:errorclass="text-danger"
                   th:errors="*{tamanho}">
                </p>
            </div>
        </div>

        <!-- Botões -->
        <div class="d-flex">
            <button type="submit"
                    class="btn btn-primary mr-2"
                    th:text="${pet.id == null} ? 'Cadastrar Pet' : 'Salvar Alterações'">
                Cadastrar Pet
            </button>

            <a th:href="@{/pet}" class="btn btn-outline-secondary">
                Voltar
            </a>
        </div>

    </form>

</div>

<th:block th:replace="~{fragments/footer :: footer()}"></th:block>

</body>
</html>
